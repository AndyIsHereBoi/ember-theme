name: Release

# Manual only. Nothing runs on push - you must trigger "Run workflow" and supply
# a version. The version may be entered with or without a leading "v".
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.4 or v1.0.4'
        required: true
        type: string

permissions:
  contents: write

env:
  PACKAGE: dev_andyishereboi_ember
  # Stamped into the archive comment, matching what `panel-rs extensions export`
  # writes. Cosmetic only.
  CALAGOPUS_VERSION: 1.2.8

jobs:
  release:
    name: Package extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalise version
        id: version
        env:
          RAW: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Accept "1.0.4" or "v1.0.4"; strip any leading v, validate, re-add it.
          clean="${RAW#v}"
          clean="${clean#V}"

          if ! [[ "$clean" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW' is not a valid version. Use semver, e.g. 1.0.4 or v1.0.4."
            exit 1
          fi

          echo "clean=$clean" >> "$GITHUB_OUTPUT"
          echo "tag=v$clean" >> "$GITHUB_OUTPUT"
          echo "Releasing $clean (tag v$clean)"

      - name: Verify version matches the extension
        env:
          CLEAN: ${{ steps.version.outputs.clean }}
        run: |
          set -euo pipefail

          manifest=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$manifest" != "$CLEAN" ]; then
            echo "::error::Cargo.toml says $manifest but you asked for $CLEAN. Bump Cargo.toml (and CHANGELOG.md) first."
            exit 1
          fi

          if ! grep -q "## $CLEAN" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no '## $CLEAN' section."
          fi

      - name: Build .c7s.zip
        id: package
        env:
          CLEAN: ${{ steps.version.outputs.clean }}
        run: |
          set -euo pipefail

          # Mirrors the layout `panel-rs extensions export` produces:
          #   Metadata.toml            at the archive root
          #   backend/                 extension root, minus frontend/migrations
          #   frontend/                frontend/ contents
          #   migrations/              migrations/ contents
          # (`.github/` and `.gitignore` are left out; the real exporter would
          # bundle them into backend/, which is just noise.)
          stage=$(mktemp -d)
          mkdir -p "$stage/backend" "$stage/frontend" "$stage/migrations"

          cp Metadata.toml "$stage/Metadata.toml"

          rsync -a \
            --exclude 'Metadata.toml' \
            --exclude 'frontend/' \
            --exclude 'migrations/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'target/' \
            --exclude 'dist/' \
            --exclude 'node_modules/' \
            --exclude '.idea/' \
            --exclude '.vscode/' \
            --exclude '.DS_Store' \
            --exclude '*.c7s.zip' \
            ./ "$stage/backend/"

          rsync -a \
            --exclude '.gitignore' \
            --exclude 'tsconfig.json' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            frontend/ "$stage/frontend/"

          if [ -d migrations ]; then
            rsync -a --exclude '.gitignore' migrations/ "$stage/migrations/"
          fi

          out="$PACKAGE-${CLEAN}.c7s.zip"
          ( cd "$stage" && zip -q -r -9 "$OLDPWD/$out" Metadata.toml backend frontend migrations )
          printf 'this .c7s.zip extension archive has been generated by calagopus@%s' "$CALAGOPUS_VERSION" | zip -q -z "$out"

          echo "asset=$out" >> "$GITHUB_OUTPUT"
          unzip -l "$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}-${{ steps.version.outputs.clean }}
          path: ${{ steps.package.outputs.asset }}

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.package.outputs.asset }}
          body: |
            Ember ${{ steps.version.outputs.clean }} — see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            Install via **Admin → Extensions → Install**, uploading
            `${{ steps.package.outputs.asset }}`.
